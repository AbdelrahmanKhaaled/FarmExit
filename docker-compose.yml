# Local development database only. Values come from the root .env (see .env.example); nothing secret is committed.
name: farmexit

services:
  mysql:
    image: mysql:8.4
    container_name: farmexit-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farmexit}
      MYSQL_USER: ${MYSQL_USER:-farmexit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    # utf8mb4 for Arabic and English content.
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_0900_ai_ci",
      ]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - farmexit-mysql-data:/var/lib/mysql
      # Creates farmexit_shadow on first volume init (see docker/mysql/init/).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  farmexit-mysql-data:
