<VirtualHost *:80>
    ServerName elwesal.nodeteam.site
    DocumentRoot /var/www/elwesal.nodeteam.site

    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:9865/
    ProxyPassReverse / http://127.0.0.1:9865/

    ErrorLog ${APACHE_LOG_DIR}/elwesal.nodeteam.site_error.log
    CustomLog ${APACHE_LOG_DIR}/elwesal.nodeteam.site_access.log combined

    RewriteEngine On
    RewriteCond %{SERVER_NAME} =elwesal.nodeteam.site
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>