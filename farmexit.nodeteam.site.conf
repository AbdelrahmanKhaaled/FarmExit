<VirtualHost *:80>
    ServerName farmexit.nodeteam.site
    DocumentRoot /var/www/farmexit.nodeteam.site
        
    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:9321/
    ProxyPassReverse / http://127.0.0.1:9321/

    ErrorLog ${APACHE_LOG_DIR}/farmexit.nodeteam.site_error.log
    CustomLog ${APACHE_LOG_DIR}/farmexit.nodeteam.site_access.log combined

    RewriteEngine On
    RewriteCond %{SERVER_NAME} =farmexit.nodeteam.site
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>